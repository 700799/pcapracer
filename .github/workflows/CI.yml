name: CI

on:
  # Deliberately not triggered by push-to-main or pull_request: every commit was
  # billing Actions minutes with no way to opt out per-push. A `v*` tag is a one-time,
  # deliberate release action; workflow_dispatch covers on-demand manual runs.
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No toolchain version here on purpose. rust-toolchain.toml is the single source, and
      # rustup honours it for every cargo invocation below — so CI and a developer's machine
      # run the same clippy and agree on what `-D warnings` rejects. Pinning the version in
      # both places would just create somewhere for them to drift apart.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib

  python:
    name: Python tests (ubuntu-latest, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Run tests against the installed package
        # Run from a scratch directory so the tests exercise the installed wheel rather
        # than the source tree — this is what catches packaging mistakes.
        run: |
          mkdir -p ../scratch
          cd ../scratch
          python -m pytest ../pcapracer/tests -v

  python-os-matrix:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # matrix context isn't available in a job-level `if`, so the OS split lives here as a
    # separate job instead of a condition on the `python` job above. macOS/Windows runners
    # are ~10x the cost of Linux, so this only runs once a change lands on main (or on a
    # release tag, which is also a `push` event).
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Run tests against the installed package
        run: |
          mkdir -p ../scratch
          cd ../scratch
          python -m pytest ../pcapracer/tests -v

  build-wheels:
    name: Wheels (${{ matrix.platform.target }} on ${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.os }}
    # Real release wheels (esp. macOS/Windows) are only needed when actually publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-13, target: x86_64 }
          - { os: macos-14, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # abi3-py39 means one wheel per platform covers every Python from 3.9 up.
          args: --release --out dist
          sccache: "true"
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, python, python-os-matrix, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no API token
      # is stored in repository secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
