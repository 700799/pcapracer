name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Wheels (${{ matrix.platform.os }} / ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  os: linux,   target: x86_64,  manylinux: auto }
          - { runner: ubuntu-latest,  os: linux,   target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest,  os: musllinux, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: macos-14,       os: macos,   target: aarch64, manylinux: auto }
          - { runner: macos-13,       os: macos,   target: x86_64,  manylinux: auto }
          - { runner: windows-latest, os: windows, target: x64,     manylinux: auto }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --strip
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Smoke-test wheel (native arch only)
        if: matrix.platform.target == 'x86_64' && matrix.platform.os == 'linux'
        run: |
          pip install pytest pyarrow
          pip install --no-index --find-links dist pcapracer
          pytest tests/ -q -k "smoke or basic or dns or flow or tls"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
