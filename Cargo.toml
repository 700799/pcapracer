[package]
name = "pcapracer"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Fast Rust-backed PCAP feature extraction to Parquet for cyber analysis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/700799/pcapracer"
readme = "README.md"
keywords = ["pcap", "parquet", "network", "security", "forensics"]
categories = ["network-programming", "parser-implementations"]

[lib]
name = "pcapracer"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
arrow = { version = "59", features = ["pyarrow"] }
parquet = { version = "59", features = ["arrow", "zstd"] }
pcap-parser = { version = "0.17", features = ["data"] }
rayon = "1.12"
ahash = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
thiserror = "2"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "dissect"
harness = false

[profile.release]
opt-level = 3
# Thin LTO rather than fat, and the default 16 codegen units rather than 1. The wide schema
# expands into one very large translation unit; with codegen-units = 1 the final crate took
# ~30 minutes to compile, a cost paid again on every CI wheel build. Thin LTO already does
# the cross-unit inlining that codegen-units = 1 would otherwise buy.
lto = "thin"
codegen-units = 16
strip = true
